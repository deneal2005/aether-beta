<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Fastlane</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="demo-body">
  <header class="site-header demo-header">
    <a class="brand" href="/" aria-label="Fastlane home"><img class="brand-image" src="assets/cCRVzU10YRsZPy9YRYGjZS5Obk.png" alt="Fastlane"></a>
    <a class="header-cta" href="/">Back to homepage <span>←</span></a>
  </header>
  <main class="login-main">
    <section class="login-card">
      <div class="login-spark">✳</div>
      <p class="eyebrow">Fastlane workspace</p>
      <h1>Welcome back.</h1>
      <p class="login-subtitle">Sign in to your marketing workspace.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@company.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
        <p class="login-error" role="alert" hidden>Those details don’t match the demo account. Try the sample below.</p>
        <button class="button button-pink login-submit" type="submit">Sign in <span>→</span></button>
      </form>
      <div class="demo-credentials"><div><span>DEMO EMAIL</span><b>demo@fastlane.local</b></div><div><span>DEMO PASSWORD</span><b>fastlane-demo</b></div><small>This is a local-only preview. No data is sent or saved.</small></div>
    </section>
  </main>
  <script src="demo.js" defer></script>
</body>
</html>
