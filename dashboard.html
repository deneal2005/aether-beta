<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070707">
  <title>Fastlane</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body class="workspace-body">
  <aside class="fl-sidebar" aria-label="Workspace sidebar">
    <a class="fl-logo" href="#home" aria-label="Fastlane home"><span class="fl-mark"><i></i><i></i><i></i></span><b>fastlane</b></a>
    <button class="workspace-switch" id="workspace-switch" aria-expanded="false"><span class="workspace-avatar">R</span><span><b>Rent Mate</b><small>Workspace</small></span><span class="switch-chevron">⌄</span></button>
    <nav class="fl-nav" aria-label="Workspace navigation">
      <a class="nav-item" href="#home" data-view="home"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m3.5 8.4 6.5-5.2 6.5 5.2M5.2 7v9.4h4.1v-4.6h1.4v4.6h4.1V7"/></svg>Home <b class="nav-count">2</b></a>
      <a class="nav-item" href="#campaigns" data-view="campaigns"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M7 7h6M7 10h6M7 13h3"/></svg>Campaigns</a>
      <a class="nav-item" href="#studio" data-view="studio"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2.6 1.8 5.6 5.6 1.8-5.6 1.8-1.8 5.6-1.8-5.6-5.6-1.8 5.6-1.8z"/><path d="m15.5 2 .6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/></svg>Studio</a>
      <a class="nav-item" href="#brand" data-view="brand"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h3v3H4zM9 4h3v3H9zM14 4h2v2h-2zM4 9h3v3H4zM9 9h3v3H9zM14 8h2v2h-2zM5 14h2v2H5zM10 14h5v2h-5z"/></svg>Brand</a>
      <a class="nav-item" href="#radar" data-view="radar"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="3.3"/><path d="M10 3.5v6.5l4.8-4.8M10 10l4.7 4.7"/></svg>Competitor Radar</a>
      <a class="nav-item" href="#analytics" data-view="analytics"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 15.5h13M5 13V9M9 13V5M13 13V7M16 13v-3"/><path d="m4.5 6.5 3.2-2 3.1 2.7 4.4-3"/></svg>Analytics</a>
      <a class="nav-item" href="#warmed" data-view="warmed"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7.2" cy="6.5" r="2.4"/><path d="M2.8 15.8c.4-2.5 2-3.8 4.4-3.8s4 1.3 4.4 3.8M13 4.6a2.3 2.3 0 0 1 0 4.4M13.2 12c2.1 0 3.5 1.2 3.9 3.2"/></svg>Warmed accounts</a>
    </nav>
    <div class="fl-chats"><div class="sidebar-section-label">CHATS <button class="new-chat" data-action="new-chat" aria-label="New chat with Senna">＋</button></div><p>No threads yet.</p></div>
    <div class="fl-side-bottom">
      <button class="credit-card" data-action="plans"><span class="workspace-avatar">R</span><span class="credit-copy"><b>Rent Mate</b><small><strong>0</strong> credits <i>0% used</i></small><span class="credit-progress"><i></i></span></span><span class="credit-chevron">⌃</span></button>
      <button class="see-plans" data-action="plans">See plans</button>
      <div class="version-card"><span>New version ready</span><div><button data-action="later">Later</button><button data-action="refresh">Refresh</button></div></div>
      <button class="profile-button" data-action="profile-menu"><span class="profile-avatar">D</span><span><b>Deneal</b><small>Owner</small></span><span class="profile-dots">···</span></button>
    </div>
  </aside>

  <main class="fl-main">
    <header class="fl-topbar"><div class="breadcrumbs" id="breadcrumbs"><span>Rent Mate</span><i>/</i><b>Home</b></div><div class="topbar-tools"><span class="trial-pill"><i></i> Trial · 0 credits</span><button class="help-button" data-action="help" aria-label="Help and support">?</button><button class="top-profile" data-action="profile-menu" aria-label="Account menu">D</button></div></header>
    <div id="app-content" tabindex="-1"></div>
  </main>

  <div class="fl-overlay" id="fl-overlay" hidden>
    <section class="fl-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <button class="dialog-close" data-action="close-dialog" aria-label="Close">×</button>
      <div id="dialog-content"></div>
    </section>
  </div>
  <div class="fl-toast" id="fl-toast" role="status" aria-live="polite"></div>
  <script src="demo.js" defer></script>
  <script src="workspace.js" defer></script>
</body>
</html>
